<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A — Creative Voltage</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d0d0d;
  }

  .slide {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #0d0d0d;
  }

  /* Halftone pattern */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #0066ff22 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: 0;
  }

  /* Electric blue panel */
  .blue-panel {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 42%;
    background: #0066ff;
    z-index: 1;
    overflow: hidden;
  }

  .blue-panel::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #ffffff18 1px, transparent 1px);
    background-size: 20px 20px;
  }

  /* Neon slash divider */
  .slash {
    position: absolute;
    left: calc(42% - 60px);
    top: 0; bottom: 0;
    width: 120px;
    background: linear-gradient(to right, #0066ff, transparent);
    z-index: 2;
    clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%);
  }

  /* Content area */
  .content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    padding: clamp(2rem, 5vw, 5rem);
  }

  .left-content {
    width: 42%;
    display: flex;
    flex-direction: column;
    gap: clamp(0.75rem, 1.5vh, 1.5rem);
  }

  .right-content {
    flex: 1;
    padding-left: clamp(2rem, 5vw, 6rem);
    display: flex;
    flex-direction: column;
    gap: clamp(0.75rem, 1.5vh, 1.5rem);
  }

  .label {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.55rem, 1vw, 0.8rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #d4ff00;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  .label-right {
    color: #d4ff00;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.4s;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(1.6rem, 4.5vw, 4.2rem);
    line-height: 0.95;
    color: #ffffff;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.4s;
  }

  h1 span {
    color: #d4ff00;
    display: block;
  }

  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.65rem, 1.2vw, 1rem);
    color: #ffffff;
    line-height: 1.5;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.8s;
  }

  .meta {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.55rem, 0.9vw, 0.75rem);
    color: #ffffff99;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 1s;
  }

  .right-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 5rem);
    line-height: 0.9;
    color: #0d0d0d;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.5s;
  }

  .right-subtitle {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.65rem, 1.1vw, 0.9rem);
    color: #0d0d0d99;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.7s;
  }

  .badge {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.5rem, 0.9vw, 0.75rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: #d4ff00;
    color: #0d0d0d;
    padding: 0.3em 0.7em;
    border-radius: 2px;
    align-self: flex-start;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.9s;
  }

  .neon-line {
    position: absolute;
    bottom: clamp(1.5rem, 4vh, 4rem);
    left: clamp(2rem, 5vw, 5rem);
    right: clamp(2rem, 5vw, 5rem);
    height: 1px;
    background: linear-gradient(to right, #d4ff00, #0066ff88, transparent);
    z-index: 4;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.2s;
  }

  .footer {
    position: absolute;
    bottom: clamp(0.75rem, 2vh, 2rem);
    left: clamp(2rem, 5vw, 5rem);
    right: clamp(2rem, 5vw, 5rem);
    z-index: 4;
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.5rem, 0.8vw, 0.65rem);
    color: #ffffff55;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards 1.4s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="blue-panel"></div>
    <div class="slash"></div>

    <div class="content">
      <div class="left-content">
        <span class="label">Jabil · Design Handoff</span>
        <h1>Global<span>IPR</span></h1>
        <p class="subtitle">Inventory<br>Planning Review<br>Dashboard</p>
        <p class="meta">Abril 2026 — Juliana Lima</p>
      </div>
      <div class="right-content">
        <span class="label label-right">// v1 · React Web</span>
        <p class="right-title">Do<br>Excel<br>ao<br>Sistema</p>
        <p class="right-subtitle">Substituindo planilhas por<br>rastreabilidade real.</p>
        <span class="badge">Design · Dev Handoff</span>
      </div>
    </div>

    <div class="neon-line"></div>
    <div class="footer">
      <span>CREATIVE VOLTAGE</span>
      <span>STYLE A</span>
    </div>
  </div>
</body>
</html>
