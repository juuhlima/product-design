<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B — Neon Cyber</title>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c14;
    --cyan: #00ffcc;
    --magenta: #ff00aa;
    --grid: #ffffff08;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); }

  .slide {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  /* Grid background */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    z-index: 0;
  }

  /* Glow orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
  }
  .orb-cyan {
    width: clamp(200px, 40vw, 500px);
    height: clamp(200px, 40vw, 500px);
    background: radial-gradient(circle, #00ffcc33 0%, transparent 70%);
    top: -10%;
    right: -5%;
    animation: pulse 4s ease-in-out infinite;
  }
  .orb-magenta {
    width: clamp(150px, 30vw, 380px);
    height: clamp(150px, 30vw, 380px);
    background: radial-gradient(circle, #ff00aa22 0%, transparent 70%);
    bottom: -5%;
    left: 10%;
    animation: pulse 5s ease-in-out infinite 1s;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* Scan lines */
  .slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      #00000015 3px,
      #00000015 4px
    );
    z-index: 1;
    pointer-events: none;
  }

  /* Content */
  .content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 6vw, 7rem);
    gap: clamp(0.5rem, 1.5vh, 1.5rem);
  }

  .top-bar {
    position: absolute;
    top: clamp(1rem, 3vh, 3rem);
    left: clamp(2rem, 6vw, 7rem);
    right: clamp(2rem, 6vw, 7rem);
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeDown 0.6s ease forwards 0.2s;
  }

  .top-label {
    font-family: 'Satoshi', 'Space Mono', monospace;
    font-size: clamp(0.5rem, 0.9vw, 0.75rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .top-status {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-family: 'Satoshi', monospace;
    font-size: clamp(0.5rem, 0.85vw, 0.7rem);
    color: #ffffff66;
    letter-spacing: 0.1em;
  }

  .dot {
    width: 6px; height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }

  .eyebrow {
    font-family: 'Satoshi', sans-serif;
    font-size: clamp(0.6rem, 1.1vw, 0.9rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--magenta);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.4s;
  }

  h1 {
    font-family: 'Clash Display', 'Syne', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 7vw, 7.5rem);
    line-height: 0.88;
    letter-spacing: -0.03em;
    color: #ffffff;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.5s;
  }

  h1 .cyan { color: var(--cyan); text-shadow: 0 0 30px var(--cyan)55; }
  h1 .outline {
    -webkit-text-stroke: 1px #ffffff44;
    color: transparent;
  }

  .descriptor {
    font-family: 'Satoshi', sans-serif;
    font-size: clamp(0.7rem, 1.4vw, 1.1rem);
    color: #ffffff88;
    line-height: 1.5;
    max-width: 500px;
    border-left: 2px solid var(--cyan);
    padding-left: 1em;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.9s;
  }

  .tags {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 1.1s;
  }

  .tag {
    font-family: 'Satoshi', monospace;
    font-size: clamp(0.5rem, 0.85vw, 0.7rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3em 0.8em;
    border: 1px solid;
    border-radius: 2px;
  }

  .tag-cyan { color: var(--cyan); border-color: var(--cyan)55; background: var(--cyan)0d; }
  .tag-mag  { color: var(--magenta); border-color: var(--magenta)55; background: var(--magenta)0d; }
  .tag-white { color: #ffffff77; border-color: #ffffff22; }

  .bottom-bar {
    position: absolute;
    bottom: clamp(1rem, 3vh, 3rem);
    left: clamp(2rem, 6vw, 7rem);
    right: clamp(2rem, 6vw, 7rem);
    display: flex;
    justify-content: space-between;
    font-family: 'Satoshi', monospace;
    font-size: clamp(0.5rem, 0.8vw, 0.65rem);
    color: #ffffff33;
    letter-spacing: 0.1em;
    border-top: 1px solid #ffffff11;
    padding-top: 0.75em;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards 1.3s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="orb orb-cyan"></div>
    <div class="orb orb-magenta"></div>

    <div class="top-bar">
      <span class="top-label">Jabil Inc. · IPR System</span>
      <span class="top-status"><span class="dot"></span> Design Handoff · Abril 2026</span>
    </div>

    <div class="content">
      <p class="eyebrow">Global Inventory Intelligence</p>
      <h1>
        <span class="cyan">IPR</span><br>
        <span class="outline">Dashboard</span>
      </h1>
      <p class="descriptor">
        Inventory Planning Review — substituindo o caos de planilhas por rastreabilidade, projeções e confiança nos dados.
      </p>
      <div class="tags">
        <span class="tag tag-cyan">React · V1</span>
        <span class="tag tag-mag">SAP · TM1</span>
        <span class="tag tag-white">Juliana Lima</span>
      </div>
    </div>

    <div class="bottom-bar">
      <span>NEON CYBER · STYLE B</span>
      <span>01 / 01</span>
    </div>
  </div>
</body>
</html>
